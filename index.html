        body {

        .gradient-text {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .card {
            background-color: rgba(23, 23, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease-in-out;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(139, 92, 246, 0.5); /* Violet-500 */
        }

        .glow-effect {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0) 60%);
            animation: rotateGlow 15s linear infinite;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Scroll-in Animation */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Header Stile */
        .header {
            animation: fadeInDown 0.8s ease-out;
        }

        .header-scrolled {
            background-color: rgba(10, 10, 10, 0.7);
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lang-switcher-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background-color: #111827; /* bg-gray-900 */

        .utm-dot { position: absolute; width: 8px; height: 8px; background-color: #a78bfa; border-radius: 50%; top: 50%; left: 50%; margin: -4px; }

function addTranslateKeys() {
    const textToKeyMap = {};
    const deTranslations = translations.de;
    for (const key in deTranslations) {
        const value = deTranslations[key];
        if (typeof value === 'string' && value.length > 2 && !value.includes('<')) {
            textToKeyMap[value.trim()] = key;
        }
    }

    document.querySelectorAll('[placeholder]').forEach(el => {
        const placeholderText = el.getAttribute('placeholder')?.trim();
        if (placeholderText && textToKeyMap[placeholderText]) {
            el.setAttribute('data-translate-key-placeholder', textToKeyMap[placeholderText]);
        }
    });

    if (textToKeyMap[document.title.trim()]) {
         document.documentElement.setAttribute('data-translate-key-title', textToKeyMap[document.title.trim()]);
    }

    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node => {
        const text = node.nodeValue.trim();
        if (textToKeyMap[text]) {
            const parent = node.parentElement;
            if (parent && !parent.closest('script, style') && !parent.hasAttribute('data-translate-key')) {
                 const hasOnlyThisText = Array.from(parent.childNodes).every(
                    child => child === node || (child.nodeType === Node.TEXT_NODE && !child.nodeValue.trim())
                 );
                 if (hasOnlyThisText) {
                    parent.setAttribute('data-translate-key', textToKeyMap[text]);
                 }
            }
        }
    });
}

function setLanguage(lang, event) {
    if (event) event.preventDefault();
    const langPack = translations[lang];
    if (!langPack) return;
    localStorage.setItem('language', lang);
    document.documentElement.lang = lang;

    const titleKey = document.documentElement.getAttribute('data-translate-key-title');
    if (titleKey && langPack[titleKey]) document.title = langPack[titleKey];
    
    document.querySelectorAll('[data-translate-key]').forEach(el => {
        const key = el.getAttribute('data-translate-key');
        if (langPack[key]) el.innerHTML = langPack[key];
    });

    document.querySelectorAll('[data-translate-key-placeholder]').forEach(el => {
        const key = el.getAttribute('data-translate-key-placeholder');
        if (langPack[key]) el.setAttribute('placeholder', langPack[key]);
    });

    const currentLangDesktop = document.getElementById('current-lang-desktop');
    if (currentLangDesktop) currentLangDesktop.textContent = langPack.langName;
    const currentFlagDesktop = document.getElementById('current-flag-desktop');
    if (currentFlagDesktop) {
        currentFlagDesktop.src = langPack.flagUrl;
        currentFlagDesktop.alt = `Flag of ${lang}`;
    }
    
    const yearSpan = document.getElementById('year') || document.getElementById('year-footer');
    if (yearSpan) yearSpan.textContent = new Date().getFullYear();

    document.getElementById('lang-switcher-dropdown')?.classList.remove('open');
    document.getElementById('mobile-menu')?.classList.add('hidden');
};

document.addEventListener('DOMContentLoaded', () => {
    addTranslateKeys();
    const savedLang = localStorage.getItem('language') || 'de';
    window.setLanguage(savedLang);

    document.getElementById('lang-switcher-button')?.addEventListener('click', (event) => {
        event.stopPropagation();
        document.getElementById('lang-switcher-dropdown')?.classList.toggle('open');
    });
    window.addEventListener('click', () => document.getElementById('lang-switcher-dropdown')?.classList.remove('open'));
    document.getElementById('mobile-menu-button')?.addEventListener('click', () => document.getElementById('mobile-menu')?.classList.toggle('hidden'));
    
    const header = document.getElementById('main-header');
    if(header) {
        window.addEventListener('scroll', () => {
            header.classList.toggle('header-scrolled', window.scrollY > 10);
        });
    }
});
// Make setLanguage globally available for onclick attributes
window.setLanguage = setLanguage;
</script></body></html>
